# TRAINING 
split_idx: 0 # Use 0-indexing for splits: 0 = V/K-01 used as queries, etc.
seed: 2024 

max_epochs: 40
warmup_epochs: 10
milestones: [10,20]
lr: 0.0001
lr_mul: 0.1

# DATA
wildcross_path: /datasets/work/d61-csirorobotics2/source/WildVPR
data_folder: images_shrunk
pos_include_radius: 5.0
pos_exclude_radius: 0.0
fov_include_radius: 10.0

train_img_size: [224, 224]

img_per_place: 4
batch_size: 128
num_workers: 32
anchor_framerate_downsample: 5
